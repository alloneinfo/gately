name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本取自 web/package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 前端构建与类型检查
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: 格式检查
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: 单元测试
        run: go test -race ./...
      - name: 交叉编译
        run: |
          for target in linux/amd64 linux/arm64 linux/arm linux/mipsle windows/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/gately
          done
