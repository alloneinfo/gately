name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # cosign 无密钥签名与构建来源证明需要 OIDC 令牌
  id-token: write
  attestations: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 构建前端
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: 交叉编译
        run: |
          mkdir -p dist
          cp LICENSE README.md dist/
          LDFLAGS="-s -w -X github.com/wangwanjie/gately/internal/version.Version=${GITHUB_REF_NAME} -X github.com/wangwanjie/gately/internal/version.Commit=${GITHUB_SHA::7} -X github.com/wangwanjie/gately/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for target in linux/amd64 linux/arm64 linux/arm linux/mipsle linux/mips linux/riscv64 windows/amd64 darwin/amd64 darwin/arm64 freebsd/amd64; do
            os=${target%/*}; arch=${target#*/}
            out=gately_${GITHUB_REF_NAME}_${os}_${arch}
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/gately$ext ./cmd/gately
            (cd dist && tar czf $out.tar.gz gately$ext LICENSE README.md && rm gately$ext)
          done
          (cd dist && rm LICENSE README.md && sha256sum *.tar.gz > checksums.txt)
      - name: 生成 SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/gately_${{ github.ref_name }}_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@v3
      - name: 签名校验和文件（cosign 无密钥）
        run: |
          cd dist
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - name: 生成构建来源证明
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          # 在镜像仓库中附带 SBOM 与构建来源证明
          sbom: true
          provenance: mode=max
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gately:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/gately:latest
      - name: 签名镜像（cosign 无密钥）
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/gately@${{ steps.push.outputs.digest }}
